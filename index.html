<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GGUF Player</title>

    <link rel="stylesheet" href="./style.css">

    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark-mode-active', 'dark');
        }
    </script>

    <style>
        :root {
            --bg-main: #f6f6f6;
            --bg-header: #f6f6f6;
            --bg-bubble-ai: #ffffff;
            --bg-bubble-user: #e9eef6;
            --text-main: #1f1f1f;
            --border-color: #e5e7eb;
        }

        .dark-mode-active {
            --bg-main: #131314;
            --bg-header: #131314;
            --bg-bubble-ai: #1e1f20;
            --bg-bubble-user: #0b57d0;
            --text-main: #e3e3e3;
            --border-color: #333537;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            margin: 0;
            overflow: hidden;
            transition: background-color 0.3s;
            font-family: Roboto, "Xhei Intel", -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, "Noto Sans", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        }

        header {
            background-color: var(--bg-header);
            border-bottom: 1px solid var(--border-color) !important;
            flex-shrink: 0;
        }

        #chat-box {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        #chat-box::-webkit-scrollbar {
            width: 6px;
        }

        #chat-box::-webkit-scrollbar-thumb {
            background-color: rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }

        .dark-mode-active #chat-box::-webkit-scrollbar-thumb {
            background-color: rgba(255, 255, 255, 0.1);
        }

        #chat-box::-webkit-scrollbar-track {
            background: transparent;
        }

        #chat-box {
            scrollbar-width: thin;
            scrollbar-color: rgba(0, 0, 0, 0.1) transparent;
        }

        footer {
            flex-shrink: 0;
            background-color: var(--bg-main);
            padding-bottom: env(safe-area-inset-bottom, 1rem);
        }

        .ai-bubble {
            background-color: var(--bg-bubble-ai) !important;
            border: 1px solid var(--border-color) !important;
            color: var(--text-main) !important;
        }

        .user-bubble {
            background-color: var(--bg-bubble-user) !important;
            color: var(--text-main) !important;
        }

        .markdown-body pre {
            background: #282c34 !important;
            padding: 1rem;
            border-radius: 0.75rem;
            margin: 0.5rem 0;
            overflow-x: auto;
        }

        img.emoji {
            height: 1.2em;
            display: inline-block;
        }

        .ai-bubble,
        .user-bubble {
            line-height: 2.0;
        }

        .ai-bubble p {
            margin-bottom: 1rem;
            /* 让 AI 输出的每个段落下面都空出固定的一行距离 */
        }

        .ai-bubble p:last-child {
            margin-bottom: 0;
            /* 最后一个段落不需要下边距，防止气泡底部留白过多 */
        }
    </style>
</head>

<div id="settings-modal"
    class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm animate-fade-in">
    <div
        class="bg-white dark:bg-[#1e1f20] w-full max-w-md p-6 rounded-2xl shadow-2xl mx-4 transition-colors duration-300">
        <h3 class="text-lg font-bold mb-4 text-gray-900 dark:text-gray-100">自定义 API 配置</h3>

        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1 text-gray-700 dark:text-gray-300">API 请求地址</label>
                <input id="custom-url" type="text" placeholder="例如: http://127.0.0.1:8021/v1/chat/completions"
                    class="w-full px-4 py-2 rounded-xl border border-gray-200 dark:border-gray-700 bg-transparent text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-800 dark:text-gray-200">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1 text-gray-700 dark:text-gray-300">API Key</label>
                <input id="custom-key" type="password" placeholder="留空则默认使用后端配置"
                    class="w-full px-4 py-2 rounded-xl border border-gray-200 dark:border-gray-700 bg-transparent text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-800 dark:text-gray-200">
            </div>
        </div>

        <div class="flex justify-end gap-3 mt-6">
            <button id="close-settings"
                class="px-4 py-2 text-sm font-medium rounded-xl hover:bg-gray-100 dark:hover:bg-white/5 text-gray-600 dark:text-gray-400">取消</button>
            <button id="save-settings"
                class="px-4 py-2 text-sm font-medium bg-[#0b57d0] text-white rounded-xl hover:bg-blue-600">保存</button>
        </div>
    </div>
</div>

<body class="font-sans">

    <header class="p-4 px-6 flex items-center justify-between z-50">
        <div class="flex items-center gap-2">
            <span class="font-bold text-xl text-[#0b57d0] tracking-tight">GGUF Player</span>
        </div>
        <div class="flex items-center gap-2">
            <button id="settings-btn"
                class="p-2 hover:bg-black/5 dark:hover:bg-white/5 rounded-xl transition-colors text-gray-600 dark:text-gray-400">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.43l-1.003.828c-.293.241-.438.613-.43.992a7.723 7.723 0 010 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.43l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 010-.255c.007-.378-.138-.75-.43-.991l-1.004-.827a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.28z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
            </button>

            <button id="download-btn" class="p-2 hover:bg-black/5 dark:hover:bg-white/5 rounded-full text-gray-500">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                </svg>
            </button>
            <button id="theme-btn" class="p-2 hover:bg-black/5 dark:hover:bg-white/5 rounded-full text-gray-500">
                <svg id="mode-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z">
                    </path>
                </svg>
            </button>
            <button id="new-chat-btn" class="p-2 hover:bg-red-50 rounded-full text-gray-500 hover:text-red-600">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16">
                    </path>
                </svg>
            </button>
        </div>
    </header>

    <main id="chat-box" class="p-4 space-y-6 max-w-4xl mx-auto w-full">
        <div class="flex justify-start">
            <div class="ai-bubble p-4 rounded-2xl shadow-sm max-w-[90%] markdown-body">你好！</div>
        </div>
    </main>

    <div id="ai-loading-template"
        class="hidden flex justify-start items-start gap-3 px-4 max-w-4xl mx-auto w-full mb-6">
        <div class="mt-4 flex-shrink-0">
            <div class="w-4 h-4 border-2 border-[#0b57d0] border-t-transparent rounded-full animate-spin"></div>
        </div>
        <div class="ai-bubble p-4 rounded-2xl shadow-sm text-sm italic opacity-70">正在思考...</div>
    </div>

    <footer>
        <div class="max-w-4xl mx-auto p-4">
            <div
                class="flex items-end rounded-[28px] border border-gray-200 dark:border-gray-700 px-4 py-2 shadow-lg bg-white dark:bg-[#1e1f20] transition-colors duration-300 focus-within:ring-2 focus-within:ring-blue-500">
                <textarea id="user-input" rows="1" placeholder="输入消息..."
                    class="flex-1 bg-transparent border-none focus:outline-none text-base py-3 resize-none min-h-[48px] max-h-[150px] leading-relaxed text-gray-800 dark:text-gray-200"
                    oninput="this.style.height = '';this.style.height = this.scrollHeight + 'px'"></textarea>
                <button id="send-btn"
                    class="ml-2 bg-[#0b57d0] text-white rounded-full font-medium mb-1 shrink-0 active:scale-95 transition-all w-20 h-11 flex items-center justify-center">发送</button>
            </div>
        </div>
    </footer>

    <script type="module" src="./chat.js"></script>
</body>

</html>
