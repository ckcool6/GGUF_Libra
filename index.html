<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GGUF Libra</title>

    <link rel="stylesheet" href="./style.css">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon.png">

    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark-mode-active', 'dark');
        }
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('SW registration successful:', reg.scope))
                    .catch(err => console.error('SW registration failed:', err));
            });
        }
    </script>

</head>



<body class="font-sans">
    <!-- Archive viewer modal -->
    <div id="archive-modal"
        class="hidden fixed inset-0 z-[60] flex items-center justify-center bg-black/60 backdrop-blur-sm">
        <div
            class="bg-white dark:bg-[#1e1f20] w-full max-w-2xl h-[80vh] flex flex-col rounded-2xl shadow-2xl mx-4 overflow-hidden">
            <div class="p-4 border-b border-gray-100 dark:border-gray-800 flex justify-between items-center">
                <h3 class="font-bold text-gray-800 dark:text-gray-200 flex items-center gap-2">
                    <span>📂</span> Side Branch Archives
                </h3>
                <button id="close-archive" class="p-2 hover:bg-gray-100 dark:hover:bg-white/5 rounded-full">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path d="M6 18L18 6M6 6l12 12" stroke-width="2"></path>
                    </svg>
                </button>
            </div>
            <div id="archive-content" class="flex-1 overflow-y-auto p-6 space-y-6 bg-gray-50 dark:bg-[#131415]">
                <!-- Archived dialogues will be rendered here -->
            </div>
            <div class="p-4 text-center text-xs text-gray-400 border-t border-gray-100 dark:border-gray-800">
                This is the original dialogue history merged into the main branch, kept for reference only.
            </div>
        </div>
    </div>
    <!-- In-page search popup panel -->
    <div id="page-search-panel"
        class="hidden absolute top-16 right-6 z-50 w-80 bg-white dark:bg-[#1e1f20] border border-gray-200 dark:border-gray-700 rounded-2xl shadow-xl flex flex-col animate-fade-in overflow-hidden">
        <div class="p-3 border-b border-gray-100 dark:border-gray-800 flex items-center gap-2">
            <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"></path>
            </svg>
            <input type="text" id="page-search-input" placeholder="Search in current dialogue..."
                class="flex-1 bg-transparent text-sm focus:outline-none text-gray-800 dark:text-gray-200">
            <button id="close-page-search" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                    </path>
                </svg>
            </button>
        </div>
        <ul id="page-search-list" class="max-h-64 overflow-y-auto text-sm">
            <!-- Search results will be dynamically injected here -->
        </ul>
    </div>
    <!-- Settings modal -->
    <div id="settings-modal"
        class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm animate-fade-in">
        <div
            class="bg-white dark:bg-[#1e1f20] w-full max-w-md p-6 rounded-2xl shadow-2xl mx-4 transition-colors duration-300">
            <h3 class="text-lg font-bold mb-4 text-gray-900 dark:text-gray-100">Custom API Configuration</h3>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1 text-gray-700 dark:text-gray-300">API Endpoint
                        URL</label>
                    <input id="custom-url" type="text" placeholder="e.g., http://127.0.0.1:8021/v1/chat/completions"
                        class="w-full px-4 py-2 rounded-xl border border-gray-200 dark:border-gray-700 bg-transparent text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-800 dark:text-gray-200">
                </div>
                <!-- Embedding API endpoint input -->
                <div>
                    <label class="block text-sm font-medium mb-1 text-gray-700 dark:text-gray-300">Embedding API
                        Endpoint URL</label>
                    <input id="custom-embedding-url" type="text" placeholder="e.g., http://127.0.0.1:8022/v1/embeddings"
                        class="w-full px-4 py-2 rounded-xl border border-gray-200 dark:border-gray-700 bg-transparent text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-800 dark:text-gray-200">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1 text-gray-700 dark:text-gray-300">API Key</label>
                    <input id="custom-key" type="password" placeholder="Leave blank to use default server configuration"
                        class="w-full px-4 py-2 rounded-xl border border-gray-200 dark:border-gray-700 bg-transparent text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-800 dark:text-gray-200">
                </div>
            </div>

            <div class="flex justify-end gap-3 mt-6">
                <button id="close-settings"
                    class="px-4 py-2 text-sm font-medium rounded-xl hover:bg-gray-100 dark:hover:bg-white/5 text-gray-600 dark:text-gray-400">Cancel</button>
                <button id="save-settings"
                    class="px-4 py-2 text-sm font-medium bg-[#0b57d0] text-white rounded-xl hover:bg-blue-600">Save</button>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header class="p-4 px-6 flex items-center justify-between z-50">
        <div class="flex items-center gap-2">
            <span class="font-bold text-xl text-[#0b57d0] tracking-tight">GGUF Libra</span>
            <span id="status-dot" class="w-2.5 h-2.5 rounded-full bg-gray-400 transition-colors duration-300 shadow-sm"
                title="Checking connection..."></span>

            <span id="token-usage" class="text-xs font-mono text-gray-400 dark:text-gray-400 ml-1 opacity-80">
                -- / -- (0%)
            </span>
        </div>
        <div class="flex items-center gap-2">
            <select id="prompt-select"
                class="bg-transparent border border-gray-200 dark:border-gray-700 rounded-xl px-2 py-1 text-xs text-gray-700 dark:text-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer transition-colors dark:bg-[#1e1f20]">
            </select>
            <button id="search-toggle-btn"
                class="p-2 hover:bg-black/5 dark:hover:bg-white/5 rounded-xl transition-colors text-gray-600 dark:text-gray-400"
                title="Search dialogue">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"></path>
                </svg>
            </button>
            <button id="settings-btn"
                class="p-2 hover:bg-black/5 dark:hover:bg-white/5 rounded-xl transition-colors text-gray-600 dark:text-gray-400">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.43l-1.003.828c-.293.241-.438.613-.43.992a7.723 7.723 0 010 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.43l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 010-.255c.007-.378-.138-.75-.43-.991l-1.004-.827a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.28z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
            </button>

            <button id="download-btn" class="p-2 hover:bg-black/5 dark:hover:bg-white/5 rounded-full text-gray-500">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                </svg>
            </button>
            <button id="theme-btn" class="p-2 hover:bg-black/5 dark:hover:bg-white/5 rounded-full text-gray-500">
                <svg id="mode-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z">
                    </path>
                </svg>
            </button>
            <button id="new-chat-btn" class="p-2 hover:bg-red-50 rounded-full text-gray-500 hover:text-red-600">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16">
                    </path>
                </svg>
            </button>
        </div>
    </header>

    <main id="chat-box" class="p-4 space-y-6 max-w-4xl mx-auto w-full">
        <div class="flex justify-start">
            <div class="ai-bubble p-4 rounded-2xl max-w-[90%] markdown-body">Hello!</div>
        </div>
    </main>

    <div id="ai-loading-template"
        class="hidden flex justify-start items-start gap-3 px-4 max-w-4xl mx-auto w-full mb-6">
        <div class="mt-4 flex-shrink-0">
            <div class="w-4 h-4 border-2 border-[#0b57d0] border-t-transparent rounded-full animate-spin"></div>
        </div>
        <div class="ai-bubble p-4 rounded-2xl text-sm italic opacity-70">Thinking...</div>
    </div>
    <footer>
        <div class="max-w-4xl mx-auto p-4">
            <div class="flex justify-end mb-2">
                <div id="branch-indicator"
                    class="px-3 py-1 text-xs font-medium rounded-full bg-gray-100 dark:bg-white/10 text-amber-600 dark:text-amber-400 transition-colors shadow-sm cursor-default">
                    Current: Main
                </div>
            </div>
            <!-- Image preview container (initially hidden) -->
            <div id="image-preview-wrapper" class="hidden mb-2 flex flex-wrap gap-2 animate-fade-in">
                <div
                    class="relative group w-20 h-20 rounded-xl border border-gray-200 dark:border-gray-700 overflow-hidden">
                    <img id="image-preview" src="" class="w-full h-full object-cover">
                    <button id="remove-image"
                        class="absolute top-1 right-1 bg-black/50 text-white rounded-full p-1 opacity-0 group-hover:opacity-100 transition-opacity">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3"
                                d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <div
                class="flex items-end rounded-3xl border border-gray-200 dark:border-gray-700 px-4 py-2 bg-white dark:bg-[#1e1f20] transition-all duration-300 shadow-sm focus-within:border-gray-300 dark:focus-within:border-gray-600">

                <!-- Knowledge base document upload button -->
                <label for="doc-input" id="upload-doc-btn"
                    class="p-2 cursor-pointer hover:bg-black/5 dark:hover:bg-white/5 rounded-full transition-colors text-gray-500 flex items-center justify-center shrink-0"
                    title="Import knowledge base document">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
                        </path>
                    </svg>
                    <input type="file" id="doc-input" accept=".cpp,.py,.go,.js" class="hidden">
                </label>

                <!-- Image upload button -->
                <label for="image-input"
                    class="p-2 cursor-pointer hover:bg-black/5 dark:hover:bg-white/5 rounded-full transition-colors text-gray-500 flex items-center justify-center shrink-0">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z">
                        </path>
                    </svg>
                    <input type="file" id="image-input" accept="image/*" class="hidden">
                </label>

                <textarea id="user-input" rows="1" placeholder="Type a message..."
                    class="flex-1 bg-transparent border-none focus:outline-none text-base py-2.5 px-2 resize-none leading-relaxed text-gray-800 dark:text-gray-200"></textarea>
                <button id="send-btn"
                    class="ml-2 bg-[#0b57d0] text-white rounded-full font-medium shrink-0 active:scale-95 transition-all w-20 h-10 flex items-center justify-center">Send</button>
            </div>

            <p class="mt-2 text-xs text-gray-400 dark:text-gray-400 text-center tracking-wide">
                AI responses may not always be accurate. Please verify important information.
            </p>
        </div>
    </footer>

    <script type="module" src="./chat.js"></script>
</body>

</html>
